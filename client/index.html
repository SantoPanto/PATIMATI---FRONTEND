<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PATIMATI</title>
    <script>
      if (typeof global === 'undefined') {
        window.global = window;
      }
    </script>
    <script>
      // React yüklenmeden önce çalışır: sayfa açılışında yanlış temayla
      // (aydınlıktan karanlığa) kısa bir "yanıp sönme" olmasın diye.
      (function () {
        try {
          var stored = window.localStorage.getItem('patimati-theme');
          var isDark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (isDark) {
            document.documentElement.classList.add('dark');
          }
        } catch (error) {
          // localStorage erişilemezse (gizli sekme vb.) sessizce aydınlık kalır.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
